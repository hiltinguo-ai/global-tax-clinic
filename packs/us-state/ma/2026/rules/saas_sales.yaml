id: ma.dor.saas_sales
name: Massachusetts sales tax on electronically delivered SaaS
applies_to: [llc, c_corp]
trigger:
  all:
    - profile.industry == "saas"
    - any:
        - '"MA" in profile.states'
        - state_revenue("MA") > 100000
severity: high
status_if_true: required
deadline: { date: "30th following period", note: "Monthly if annual sales-tax liability exceeds $1,200" }
evidence_needed:
  - MA vs non-MA customer billing
  - exemption certificates where SaaS is not taxable
forms: ["ST-9"]
numbers: ["6.25", "100000", "1200"]
citations:
  - { src: "830 CMR 64H.1.3", url: "https://www.mass.gov/regulations/830-CMR-64h13-computer-services", passage_id: "ma-saas" }
  - { src: "MA sales tax", url: "https://www.mass.gov/sales-and-use-tax", passage_id: "ma-sales" }
explain_hints:
  - "Prewritten software delivered electronically is taxable tangible personal property in Massachusetts."
  - "Economic nexus for sales tax is $100,000 of MA sales in the prior or current calendar year."
