id: hk.ird.provisional
name: Hong Kong provisional tax
applies_to: [individual, llc, c_corp]
trigger:
  any:
    - '"HK" in profile.residencies'
    - any(profile.income_streams[*].country == "HK")
severity: low
status_if_true: check
deadline: { date: "as-assessed" }
evidence_needed:
  - prior-year assessment
  - holdover application facts if income fell
forms: ["provisional tax"]
numbers: []
citations:
  - { src: "IRD provisional tax", url: "https://www.ird.gov.hk/eng/tax/ind_ptm.htm", passage_id: "hk-prov" }
explain_hints:
  - "HK bills provisional tax on last year's figures. A US person who left HK still receives a bill until they hold over or object."
